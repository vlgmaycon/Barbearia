<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Barbearia Elite</title>
  
  <!-- Fontes e Ícones -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- React 18 & Babel via CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* =========================================================
       RESET & VARIÁVEIS DE ESTILO
    ========================================================= */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    :root {
      --bg: #0a0b0b;
      --bg-light: #101111;
      --surface: #141515;
      --gold: #c9a86a;
      --gold-light: #d9bd86;
      --gold-dark: #9e7d45;
      --cream: #eee7da;
      --text: #ded9d0;
      --white: #ffffff;
      --muted: #8f8c84;
      --border: rgba(201, 168, 106, 0.3);
      --border-light: rgba(255, 255, 255, 0.1);
      --container: 1180px;
      --transition: 0.3s ease;
      --wpp-green: #25d366;
    }

    body {
      font-family: "Montserrat", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
    }
    img { display: block; width: 100%; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    ul { list-style: none; }

    .container { width: min(var(--container), calc(100% - 40px)); margin: 0 auto; }
    .eyebrow { display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--gold-light); font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px; }
    .section-heading { margin-bottom: 35px; text-align: center; }
    .section-heading h2 { margin-top: 6px; font-size: clamp(28px, 4vw, 40px); font-weight: 800; color: var(--cream); text-transform: uppercase; }

    /* =========================================================
       HERO & MENU
    ========================================================= */
    .hero-full-section {
      position: relative;
      min-height: 75vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 50px 20px 60px;
      background: linear-gradient(180deg, rgba(10,11,11,0.45) 0%, rgba(10,11,11,0.85) 75%, var(--bg) 100%),
                  url("https://images.unsplash.com/photo-1621605815971-fbc98d665033?auto=format&fit=crop&w=2200&q=90") center/cover no-repeat;
    }
    .hero-logo { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-bottom: 35px; z-index: 2; }
    .hero-logo i { font-size: 34px; color: var(--gold-light); }
    .hero-logo span { font-size: 9px; font-weight: 600; letter-spacing: 4px; color: var(--muted); text-transform: uppercase; }
    .hero-logo strong { font-size: 26px; font-weight: 900; letter-spacing: 3px; color: var(--gold-light); text-transform: uppercase; }

    .hero-nav { z-index: 2; margin-bottom: 40px; width: 100%; }
    .nav-pills, .catalog-pills-container { display: flex; justify-content: center; align-items: center; gap: 15px; flex-wrap: wrap; max-width: 880px; margin: 0 auto; }
    .nav-pill {
      flex: 1; min-width: 140px; max-width: 200px; padding: 13px 20px; text-align: center; border-radius: 50px;
      border: 1px solid var(--border); background: rgba(16, 17, 17, 0.45); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      color: var(--text); font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; transition: var(--transition);
      cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    }
    .nav-pill:hover, .nav-pill.active {
      background: linear-gradient(135deg, var(--gold-light), var(--gold)); color: #111; border-color: var(--gold-light); box-shadow: 0 0 20px rgba(201, 168, 106, 0.35);
    }

    .hero-content { text-align: center; max-width: 720px; margin: auto 0; z-index: 2; display: flex; flex-direction: column; align-items: center; }
    .hero-title { font-size: clamp(32px, 5vw, 52px); font-weight: 800; color: var(--cream); text-transform: uppercase; margin: 15px 0 20px; line-height: 1.15; }
    .hero-title strong { color: var(--gold-light); }
    .hero-subtitle { font-size: 14px; color: #c4c0b8; margin-bottom: 25px; max-width: 580px; margin-left: auto; margin-right: auto; }

    /* =========================================================
       CATÁLOGO DE SERVIÇOS
    ========================================================= */
    .catalog-section { padding: 70px 0; background: var(--bg); }
    .vertical-services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 25px; max-width: 900px; margin: 0 auto; }
    .service-card-vertical { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; text-align: center; transition: var(--transition); }
    .service-card-vertical:hover { border-color: var(--gold); transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
    .service-card-vertical .service-image { width: 100%; height: 220px; overflow: hidden; border-bottom: 1px solid var(--border-light); }
    .service-card-vertical .service-image img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
    .service-card-vertical:hover .service-image img { transform: scale(1.05); }
    .service-info { padding: 20px; }
    .service-info h3 { color: var(--cream); font-size: 16px; font-weight: 700; margin-bottom: 8px; }
    .service-info p { color: var(--gold-light); font-size: 18px; font-weight: 800; }

    .packages-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; }
    .package-card { position: relative; display: flex; flex-direction: column; padding: 35px 25px; border: 1px solid var(--border-light); background: var(--surface); text-align: center; border-radius: 8px; transition: var(--transition); }
    .package-card:hover { transform: translateY(-5px); border-color: var(--gold); }
    .package-card.featured { border-color: var(--gold); box-shadow: 0 0 20px rgba(201, 168, 106, 0.15); }
    .package-badge { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); padding: 4px 14px; background: var(--gold); color: #111; font-size: 9px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; border-radius: 20px; }
    .package-icon { font-size: 28px; color: var(--gold); margin-bottom: 15px; }
    .package-card h3 { color: var(--cream); font-size: 18px; font-weight: 800; margin-bottom: 20px; }
    .package-card ul { display: flex; flex-direction: column; gap: 10px; text-align: left; margin-bottom: 25px; }
    .package-card li { color: var(--text); font-size: 12px; display: flex; align-items: center; gap: 8px; }
    .package-card li i { color: var(--gold); }
    .package-price { margin-top: auto; margin-bottom: 20px; color: var(--cream); font-size: 28px; font-weight: 800; }
    .package-button {
      display: inline-flex; align-items: center; justify-content: center; border: 0; background: linear-gradient(135deg, var(--gold-light), var(--gold));
      color: #111; font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; transition: var(--transition);
      height: 46px; border-radius: 50px;
    }
    .package-button:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(201, 168, 106, 0.3); }

    /* =========================================================
       AGENDAMENTO
    ========================================================= */
    .booking-section { padding: 70px 0 90px; background: var(--bg-light); }
    .booking-fluid-container { max-width: 1040px; margin: 0 auto; }

    .service-select-top { margin-bottom: 30px; }
    .service-select-top label { color: var(--gold-light); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; display: block; margin-bottom: 8px; }
    
    .custom-pill-input {
      width: 100%; height: 50px; padding: 0 22px; border: 1px solid var(--border); border-radius: 50px;
      background: rgba(16, 17, 17, 0.65); backdrop-filter: blur(10px); color: var(--cream);
      font-size: 13px; font-weight: 600; outline: none; transition: var(--transition);
    }
    .custom-pill-input:focus { border-color: var(--gold); box-shadow: 0 0 15px rgba(201, 168, 106, 0.3); background: rgba(20, 21, 21, 0.9); }

    .custom-dropdown-container { position: relative; width: 100%; }
    .custom-dropdown-trigger { display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; }
    .custom-dropdown-trigger:hover, .custom-dropdown-trigger.open { border-color: var(--gold); box-shadow: 0 0 15px rgba(201, 168, 106, 0.3); background: rgba(20, 21, 21, 0.9); }
    .custom-dropdown-trigger .select-arrow-icon { color: var(--gold); font-size: 12px; transition: transform 0.3s ease; }
    .custom-dropdown-trigger.open .select-arrow-icon { transform: rotate(180deg); }
    .custom-dropdown-menu {
      position: absolute; top: calc(100% + 8px); left: 0; right: 0;
      background: rgba(20, 21, 21, 0.95); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
      border: 1px solid var(--gold); border-radius: 16px; padding: 8px; z-index: 100;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8); display: flex; flex-direction: column; gap: 4px;
      max-height: 280px; overflow-y: auto;
    }
    .custom-dropdown-option {
      padding: 12px 20px; border-radius: 50px; color: var(--text); font-size: 13px; font-weight: 600;
      cursor: pointer; transition: var(--transition); display: flex; align-items: center; justify-content: space-between;
    }
    .custom-dropdown-option:hover { background: rgba(201, 168, 106, 0.15); color: var(--gold-light); }
    .custom-dropdown-option.selected { background: linear-gradient(135deg, var(--gold-light), var(--gold)); color: #111; font-weight: 800; }

    .booking-main-grid { display: grid; grid-template-columns: 240px 1fr; gap: 30px; margin-bottom: 25px; }

    .barbers-vertical-list { display: flex; flex-direction: column; gap: 12px; }
    .barbers-vertical-list label { color: var(--gold-light); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 2px; }
    
    .barber-row-item {
      display: flex; align-items: center; gap: 14px; padding: 10px 14px;
      background: rgba(16, 17, 17, 0.5); border: 1px solid var(--border-light); border-radius: 50px;
      cursor: pointer; transition: var(--transition);
    }
    .barber-row-item:hover:not(.selected) { border-color: var(--border); background: rgba(20, 21, 21, 0.8); }
    .barber-avatar-thumb {
      width: 44px; height: 44px; border-radius: 50%; overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.2); flex-shrink: 0; transition: var(--transition);
    }
    .barber-avatar-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .barber-row-item span { font-size: 13px; font-weight: 600; color: var(--white); transition: var(--transition); }
    
    .barber-row-item.selected {
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
      border-color: var(--gold-light);
      box-shadow: 0 8px 20px rgba(201, 168, 106, 0.3);
    }
    .barber-row-item.selected .barber-avatar-thumb { border-color: #111; box-shadow: 0 0 10px rgba(0, 0, 0, 0.3); }
    .barber-row-item.selected span { color: #111; font-weight: 800; }

    .calendar-hours-wrapper { display: flex; flex-direction: column; }
    .calendar-hours-wrapper label { color: var(--gold-light); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 10px; }

    .compact-booking-panel {
      display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
      background: rgba(16, 17, 17, 0.5); border: 1px solid var(--border-light);
      border-radius: 16px; padding: 20px;
    }

    .compact-calendar { width: 100%; }
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; color: var(--cream); font-weight: 700; font-size: 13px; }
    .calendar-header button { background: transparent; border: 1px solid var(--border); color: var(--gold); width: 28px; height: 28px; border-radius: 50%; transition: var(--transition); }
    .calendar-header button:hover { background: var(--gold); color: #111; }
    .calendar-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; margin-bottom: 6px; }
    .calendar-weekdays span { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; }
    
    .calendar-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
    .calendar-day {
      height: 30px; display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 600; color: var(--cream); border-radius: 6px; cursor: pointer;
      background: rgba(255, 255, 255, 0.02); transition: var(--transition);
    }
    .calendar-day:hover:not(.disabled) { border: 1px solid var(--gold); background: rgba(201, 168, 106, 0.15); }
    .calendar-day.selected { background: var(--gold) !important; color: #111 !important; font-weight: 800; box-shadow: 0 0 10px rgba(201, 168, 106, 0.3); }
    .calendar-day.disabled { opacity: 0.2; cursor: not-allowed; }

    .compact-hours-panel { display: flex; flex-direction: column; border-left: 1px dashed var(--border-light); padding-left: 20px; }
    .hours-title { font-size: 11px; font-weight: 700; color: var(--gold-light); text-transform: uppercase; margin-bottom: 10px; }
    .time-slots-compact-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .time-slot-compact {
      padding: 8px 0; text-align: center; background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-light); border-radius: 20px; color: var(--cream);
      font-size: 11px; font-weight: 600; cursor: pointer; transition: var(--transition);
    }
    .time-slot-compact:hover:not(.occupied) { border-color: var(--gold); background: rgba(201, 168, 106, 0.2); }
    .time-slot-compact.selected { background: var(--gold); color: #111; font-weight: 800; border-color: var(--gold); box-shadow: 0 0 10px rgba(201, 168, 106, 0.3); }
    .time-slot-compact.occupied { opacity: 0.2; cursor: not-allowed; text-decoration: line-through; border-color: transparent; }

    .booking-bottom-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; align-items: end; margin-top: 10px; }
    .booking-bottom-row .form-group { margin-bottom: 0; }
    
    .booking-submit-btn {
      width: 100%; height: 50px; border: 0;
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
      color: #111; font-size: 11px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase;
      border-radius: 50px; transition: var(--transition); box-shadow: 0 8px 20px rgba(201, 168, 106, 0.25);
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .booking-submit-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(201, 168, 106, 0.4); }

    /* =========================================================
       BOTÃO FLUTUANTE WHATSAPP COM ANIMAÇÃO E TEXTO
    ========================================================= */
    .wpp-float-btn {
      position: fixed;
      bottom: 25px;
      right: 25px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--wpp-green);
      color: #ffffff;
      padding: 8px 12px 8px 20px;
      border-radius: 50px;
      box-shadow: 0 8px 25px rgba(37, 211, 102, 0.4);
      z-index: 1000;
      transition: var(--transition);
      text-decoration: none;
      animation: pulse-wpp 2s infinite;
    }

    .wpp-float-btn:hover {
      transform: scale(1.05) translateY(-3px);
      box-shadow: 0 12px 30px rgba(37, 211, 102, 0.6);
      color: #ffffff;
    }

    .wpp-float-text {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
    }

    .wpp-icon-circle {
      width: 38px;
      height: 38px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    /* Animação de Pulsar */
    @keyframes pulse-wpp {
      0% {
        box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7);
      }
      70% {
        box-shadow: 0 0 0 15px rgba(37, 211, 102, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(37, 211, 102, 0);
      }
    }

    /* =========================================================
       CONTATOS & FOOTER
    ========================================================= */
    .extra-section { padding: 80px 0; background: var(--bg); }
    .extra-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; margin-bottom: 40px; }
    .contact-card { display: block; background: var(--surface); border: 1px solid var(--border-light); padding: 30px; text-align: center; border-radius: 8px; transition: var(--transition); text-decoration: none; color: inherit; }
    .contact-card:hover { border-color: var(--gold); transform: translateY(-4px); box-shadow: 0 8px 25px rgba(201, 168, 106, 0.15); }
    .contact-card.wpp-card:hover { border-color: var(--wpp-green); box-shadow: 0 8px 25px rgba(37, 211, 102, 0.25); }
    .contact-card.wpp-card:hover .contact-icon { color: var(--wpp-green); }
    .contact-icon { font-size: 30px; color: var(--gold); margin-bottom: 15px; transition: var(--transition); }
    .contact-card h4 { color: var(--cream); font-size: 16px; font-weight: 700; margin-bottom: 8px; }
    .contact-card p { color: var(--muted); font-size: 12px; line-height: 1.6; }

    .social-cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
    .social-card { display: flex; align-items: center; justify-content: center; gap: 10px; background: rgba(25, 26, 25, 0.8); border: 1px solid var(--border-light); padding: 15px; border-radius: 50px; color: var(--cream); font-size: 12px; font-weight: 700; transition: var(--transition); }
    .social-card i { font-size: 18px; color: var(--gold); }
    .social-card:hover { background: var(--gold); color: #111; border-color: var(--gold); }
    .social-card:hover i { color: #111; }

    /* MODAL */
    .modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 2000; }
    .modal.active { display: flex; }
    .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); }
    .modal-content { position: relative; background: var(--surface); border: 1px solid var(--gold); padding: 40px; border-radius: 12px; max-width: 420px; text-align: center; z-index: 1; }

    .footer { padding: 25px 0 35px; background: #060707; text-align: center; border-top: 1px solid var(--border-light); color: var(--muted); font-size: 11px; }

    @media (max-width: 900px) {
      .booking-main-grid { grid-template-columns: 1fr; }
      .compact-booking-panel { grid-template-columns: 1fr; }
      .compact-hours-panel { border-left: 0; border-top: 1px dashed var(--border-light); padding-left: 0; padding-top: 15px; margin-top: 15px; }
      .booking-bottom-row { grid-template-columns: 1fr; }
      .packages-grid, .extra-grid { grid-template-columns: 1fr; }
      .social-cards-grid { grid-template-columns: 1fr; }
      .wpp-float-btn { bottom: 20px; right: 20px; padding: 6px 10px 6px 14px; }
      .wpp-float-text { font-size: 11px; }
      .wpp-icon-circle { width: 32px; height: 32px; font-size: 18px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function Barbearia() {
      const [activeTab, setActiveTab] = useState("cabelo");
      const [activeNav, setActiveNav] = useState("catalogo");
      
      // Form States
      const [service, setService] = useState("Corte Tradicional - R$ 50,00");
      const [isServiceOpen, setIsServiceOpen] = useState(false);
      const [selectedBarber, setSelectedBarber] = useState("Carlos");
      const [calendarDate, setCalendarDate] = useState(new Date());
      const [selectedDateStr, setSelectedDateStr] = useState("2026-08-25");
      const [selectedTimeStr, setSelectedTimeStr] = useState("14:00");
      const [name, setName] = useState("");
      const [phone, setPhone] = useState("");
      const [modalOpen, setModalOpen] = useState(false);

      const servicesList = [
        "Corte Tradicional - R$ 50,00",
        "Corte Degradê / Fade - R$ 60,00",
        "Barba com Toalha Quente - R$ 45,00",
        "Modelagem de Barba - R$ 35,00",
        "Pacote Premium (Cabelo + Barba) - R$ 90,00",
        "Pacote Executivo VIP - R$ 130,00"
      ];

      const scheduleMap = {
        "Carlos": ["09:00", "11:00", "15:00"],
        "Lucas": ["10:00", "14:00", "16:00"],
        "Matheus": ["09:00", "13:00", "17:00"],
        "Qualquer": ["11:00"]
      };

      const handlePhoneChange = (e) => {
        let val = e.target.value.replace(/\D/g, "").slice(0, 11);
        if (val.length > 10) val = val.replace(/^(\d{2})(\d{5})(\d{4})$/, "($1) $2-$3");
        else if (val.length > 5) val = val.replace(/^(\d{2})(\d{4})(\d{0,4})$/, "($1) $2-$3");
        else if (val.length > 2) val = val.replace(/^(\d{2})(\d{0,5})$/, "($1) $2");
        setPhone(val);
      };

      const monthNames = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
      const allHours = ["09:00", "10:00", "11:00", "13:00", "14:00", "15:00", "16:00", "17:00", "18:00"];

      const year = calendarDate.getFullYear();
      const month = calendarDate.getMonth();
      const firstDayIndex = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();
      const today = new Date();
      today.setHours(0,0,0,0);

      const changeMonth = (offset) => {
        const newD = new Date(calendarDate);
        newD.setMonth(newD.getMonth() + offset);
        setCalendarDate(newD);
      };

      const handleSelectPackage = (packageName) => {
        setService(packageName);
        setActiveNav("agendamento");
        const section = document.getElementById("agendamento");
        if (section) section.scrollIntoView({ behavior: "smooth" });
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!selectedDateStr) return alert("Por favor, selecione uma data no calendário.");
        if (!selectedTimeStr) return alert("Por favor, selecione um horário.");
        setModalOpen(true);
      };

      return (
        <div>
          {/* TOPO / HERO */}
          <section id="inicio" className="hero-full-section">
            <div className="hero-logo">
              <i className="fa-solid fa-scissors"></i>
              <span>TRADIÇÃO & ESTILO</span>
              <strong>BARBEARIA ELITE</strong>
            </div>

            <nav className="hero-nav">
              <div className="nav-pills">
                <a href="#catalogo" className={`nav-pill ${activeNav === 'catalogo' ? 'active' : ''}`} onClick={() => setActiveNav('catalogo')}>CATÁLOGO</a>
                <a href="#agendamento" className={`nav-pill ${activeNav === 'agendamento' ? 'active' : ''}`} onClick={() => setActiveNav('agendamento')}>AGENDAMENTO</a>
                <a href="#contatos" className={`nav-pill ${activeNav === 'contatos' ? 'active' : ''}`} onClick={() => setActiveNav('contatos')}>CONTATOS</a>
              </div>
            </nav>

            <div className="hero-content">
              <div className="eyebrow"><i className="fa-solid fa-crown"></i> ESTILO & TRADIÇÃO</div>
              <h1 className="hero-title">Exclusividade em <strong>Cada Detalhe</strong></h1>
              <p className="hero-subtitle">Cortes modernos, barba alinhada e um atendimento exclusivo pensado para a sua melhor experiência visual e de bem-estar.</p>
            </div>
          </section>

          {/* CATÁLOGO DE SERVIÇOS */}
          <section id="catalogo" className="catalog-section">
            <div className="container">
              <div className="section-heading">
                <div className="eyebrow">Nosso Catálogo</div>
                <h2>Serviços & Pacotes Especializados</h2>
              </div>

              <div className="catalog-pills-container">
                <button className={`nav-pill ${activeTab === 'cabelo' ? 'active' : ''}`} onClick={() => setActiveTab('cabelo')}>
                  <i className="fa-solid fa-scissors"></i> CABELO
                </button>
                <button className={`nav-pill ${activeTab === 'barba' ? 'active' : ''}`} onClick={() => setActiveTab('barba')}>
                  <i className="fa-solid fa-user-ninja"></i> BARBA
                </button>
                <button className={`nav-pill ${activeTab === 'combo' ? 'active' : ''}`} onClick={() => setActiveTab('combo')}>
                  <i className="fa-solid fa-star"></i> COMBOS
                </button>
              </div>

              <div className="catalog-tab-content" style={{ marginTop: '30px' }}>
                {activeTab === 'cabelo' && (
                  <div className="vertical-services-grid">
                    <div className="service-card-vertical">
                      <div className="service-image"><img src="https://images.unsplash.com/photo-1503951914875-452162b0f3f1?auto=format&fit=crop&w=600&q=80" alt="Corte Tradicional" /></div>
                      <div className="service-info"><h3>Corte Tradicional</h3><p>R$ 50,00</p></div>
                    </div>
                    <div className="service-card-vertical">
                      <div className="service-image"><img src="https://images.unsplash.com/photo-1599351431202-1e0f0137899a?auto=format&fit=crop&w=600&q=80" alt="Corte Degradê / Fade" /></div>
                      <div className="service-info"><h3>Corte Degradê / Fade</h3><p>R$ 60,00</p></div>
                    </div>
                  </div>
                )}

                {activeTab === 'barba' && (
                  <div className="vertical-services-grid">
                    <div className="service-card-vertical">
                      <div className="service-image"><img src="https://images.unsplash.com/photo-1621605815971-fbc98d665033?auto=format&fit=crop&w=600&q=80" alt="Barba com Toalha Quente" /></div>
                      <div className="service-info"><h3>Barba com Toalha Quente</h3><p>R$ 45,00</p></div>
                    </div>
                    <div className="service-card-vertical">
                      <div className="service-image"><img src="https://images.unsplash.com/photo-1517832606299-7ae9b720a186?auto=format&fit=crop&w=600&q=80" alt="Modelagem de Barba" /></div>
                      <div className="service-info"><h3>Modelagem de Barba</h3><p>R$ 35,00</p></div>
                    </div>
                  </div>
                )}

                {activeTab === 'combo' && (
                  <div className="packages-grid">
                    <div className="package-card">
                      <div className="package-icon"><i className="fa-solid fa-scissors"></i></div>
                      <h3>Pacote Tradicional</h3>
                      <ul>
                        <li><i className="fa-solid fa-check"></i> Corte de Cabelo Escolhido</li>
                        <li><i className="fa-solid fa-check"></i> Lavagem Capilar Especial</li>
                        <li><i className="fa-solid fa-check"></i> Finalização com Pomada</li>
                      </ul>
                      <div className="package-price">R$ 50</div>
                      <button className="package-button" onClick={() => handleSelectPackage("Corte Tradicional - R$ 50,00")}>Selecionar</button>
                    </div>

                    <div className="package-card featured">
                      <div className="package-badge">MAIS POPULAR</div>
                      <div className="package-icon"><i className="fa-solid fa-crown"></i></div>
                      <h3>Pacote Premium</h3>
                      <ul>
                        <li><i className="fa-solid fa-check"></i> Corte + Barba Completa</li>
                        <li><i className="fa-solid fa-check"></i> Terapia com Toalha Quente</li>
                        <li><i className="fa-solid fa-check"></i> Design de Sobrancelha</li>
                      </ul>
                      <div className="package-price">R$ 90</div>
                      <button className="package-button" onClick={() => handleSelectPackage("Pacote Premium (Cabelo + Barba) - R$ 90,00")}>Selecionar</button>
                    </div>

                    <div className="package-card">
                      <div className="package-icon"><i className="fa-solid fa-gem"></i></div>
                      <h3>Pacote Executivo</h3>
                      <ul>
                        <li><i className="fa-solid fa-check"></i> Combo VIP Cabelo & Barba</li>
                        <li><i className="fa-solid fa-check"></i> Hidratação Capilar Profunda</li>
                        <li><i className="fa-solid fa-check"></i> Cerveja ou Café Cortesia</li>
                      </ul>
                      <div className="package-price">R$ 130</div>
                      <button className="package-button" onClick={() => handleSelectPackage("Pacote Executivo VIP - R$ 130,00")}>Selecionar</button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          </section>

          {/* AGENDAMENTO */}
          <section id="agendamento" className="booking-section">
            <div className="container">
              <div className="booking-fluid-container">
                
                <div className="section-heading">
                  <div className="eyebrow">Agendamento Online</div>
                  <h2>Garanta seu Horário</h2>
                </div>

                <form onSubmit={handleSubmit}>
                  <div className="service-select-top">
                    <label>1. Serviço Selecionado</label>
                    <div className="custom-dropdown-container">
                      <div 
                        className={`custom-pill-input custom-dropdown-trigger ${isServiceOpen ? 'open' : ''}`}
                        onClick={() => setIsServiceOpen(!isServiceOpen)}
                      >
                        <span>{service}</span>
                        <i className="fa-solid fa-chevron-down select-arrow-icon"></i>
                      </div>

                      {isServiceOpen && (
                        <div className="custom-dropdown-menu">
                          {servicesList.map((item) => (
                            <div 
                              key={item} 
                              className={`custom-dropdown-option ${service === item ? 'selected' : ''}`}
                              onClick={() => {
                                setService(item);
                                setIsServiceOpen(false);
                              }}
                            >
                              <span>{item}</span>
                              {service === item && <i className="fa-solid fa-check"></i>}
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>

                  <div className="booking-main-grid">
                    <div className="barbers-vertical-list">
                      <label>2. Profissional</label>
                      {[
                        { name: "Qualquer", img: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80" },
                        { name: "Carlos", img: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=200&q=80" },
                        { name: "Lucas", img: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=200&q=80" },
                        { name: "Matheus", img: "https://images.unsplash.com/photo-1522075469751-3a6694fb2f61?auto=format&fit=crop&w=200&q=80" }
                      ].map((b) => (
                        <div 
                          key={b.name} 
                          className={`barber-row-item ${selectedBarber === b.name ? 'selected' : ''}`}
                          onClick={() => setSelectedBarber(b.name)}
                        >
                          <div className="barber-avatar-thumb">
                            <img src={b.img} alt={b.name} />
                          </div>
                          <span>{b.name}</span>
                        </div>
                      ))}
                    </div>

                    <div className="calendar-hours-wrapper">
                      <label>3. Data e Horário Disponível</label>
                      <div className="compact-booking-panel">
                        <div className="compact-calendar">
                          <div className="calendar-header">
                            <button type="button" onClick={() => changeMonth(-1)}>&lt;</button>
                            <span>{monthNames[month]} {year}</span>
                            <button type="button" onClick={() => changeMonth(1)}>&gt;</button>
                          </div>
                          
                          <div className="calendar-weekdays">
                            <span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span>
                          </div>
                          
                          <div className="calendar-days">
                            {Array.from({ length: firstDayIndex }).map((_, i) => (
                              <div key={`empty-${i}`} className="calendar-day disabled"></div>
                            ))}
                            {Array.from({ length: totalDays }).map((_, i) => {
                              const d = i + 1;
                              const thisDate = new Date(year, month, d);
                              const isoStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                              const isDisabled = thisDate < today;
                              const isSelected = selectedDateStr === isoStr;

                              return (
                                <div 
                                  key={d} 
                                  className={`calendar-day ${isDisabled ? 'disabled' : ''} ${isSelected ? 'selected' : ''}`}
                                  onClick={() => !isDisabled && setSelectedDateStr(isoStr)}
                                >
                                  {d}
                                </div>
                              );
                            })}
                          </div>
                        </div>

                        <div className="compact-hours-panel">
                          <div className="hours-title">Horários ({selectedBarber})</div>
                          <div className="time-slots-compact-grid">
                            {allHours.map((hour) => {
                              const isOccupied = scheduleMap[selectedBarber]?.includes(hour);
                              const isSelected = selectedTimeStr === hour;

                              return (
                                <div 
                                  key={hour} 
                                  className={`time-slot-compact ${isOccupied ? 'occupied' : ''} ${isSelected && !isOccupied ? 'selected' : ''}`}
                                  onClick={() => !isOccupied && setSelectedTimeStr(hour)}
                                >
                                  {hour}
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div className="booking-bottom-row">
                    <div className="form-group">
                      <label style={{ color: 'var(--gold-light)', fontSize: '11px', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '1px' }}>Seu Nome</label>
                      <input 
                        type="text" 
                        className="custom-pill-input"
                        required 
                        value={name} 
                        onChange={(e) => setName(e.target.value)} 
                        placeholder="Digite seu nome completo" 
                      />
                    </div>

                    <div className="form-group">
                      <label style={{ color: 'var(--gold-light)', fontSize: '11px', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '1px' }}>WhatsApp / Telefone</label>
                      <input 
                        type="text" 
                        className="custom-pill-input"
                        required 
                        value={phone} 
                        onChange={handlePhoneChange} 
                        placeholder="(00) 00000-0000" 
                      />
                    </div>

                    <button type="submit" className="booking-submit-btn">
                      <i className="fa-solid fa-calendar-check"></i> Confirmar Agendamento
                    </button>
                  </div>

                </form>
              </div>
            </div>
          </section>

          {/* CONTATOS & RODAPÉ */}
          <section id="contatos" className="extra-section">
            <div className="container">
              <div className="section-heading">
                <div className="eyebrow">Localização & Atendimento</div>
                <h2>Venha nos Visitar</h2>
              </div>

              <div className="extra-grid">
                {/* CARD DE ENDEREÇO (ABRE GOOGLE MAPS / GPS) */}
                <a 
                  href="https://www.google.com/maps/search/?api=1&query=Av.+Paulista,+1000+-+Bela+Vista,+São+Paulo+-+SP" 
                  target="_blank" 
                  rel="noopener noreferrer" 
                  className="contact-card"
                >
                  <div className="contact-icon"><i className="fa-solid fa-location-dot"></i></div>
                  <h4>Endereço</h4>
                  <p>Av. Paulista, 1000 - Bela Vista<br />São Paulo - SP<br /><small style={{ color: 'var(--gold-light)', fontStyle: 'italic', display: 'inline-block', marginTop: '4px' }}>Clique para abrir no GPS</small></p>
                </a>

                <div className="contact-card">
                  <div className="contact-icon"><i className="fa-solid fa-clock"></i></div>
                  <h4>Funcionamento</h4>
                  <p>Segunda a Sexta: 09h às 20h<br />Sábado: 08h às 19h</p>
                </div>

                {/* CARD DE ATENDIMENTO (WHATSAPP) */}
                <a 
                  href="https://wa.me/5511999998888?text=Olá!%20Gostaria%20de%20atendimento%20ou%20informações." 
                  target="_blank" 
                  rel="noopener noreferrer" 
                  className="contact-card wpp-card"
                >
                  <div className="contact-icon"><i className="fa-brands fa-whatsapp"></i></div>
                  <h4>Atendimento</h4>
                  <p>WhatsApp: (11) 99999-8888<br />Clique para chamar no WhatsApp</p>
                </a>
              </div>

              {/* REDES SOCIAIS */}
              <div className="social-cards-grid">
                <a href="#contatos" className="social-card"><i className="fa-brands fa-instagram"></i> Instagram</a>
                <a href="#contatos" className="social-card"><i className="fa-brands fa-facebook-f"></i> Facebook</a>
                <a href="#contatos" className="social-card"><i className="fa-brands fa-tiktok"></i> TikTok</a>
              </div>
            </div>
          </section>

          {/* BOTÃO FLUTUANTE DO WHATSAPP COM ANIMAÇÃO E FRASE */}
          <a 
            href="https://wa.me/5511999998888?text=Olá!%20Gostaria%20de%20agendar%20um%20horário." 
            target="_blank" 
            rel="noopener noreferrer" 
            className="wpp-float-btn"
          >
            <span className="wpp-float-text">Agende também pelo WhatsApp</span>
            <div className="wpp-icon-circle">
              <i className="fa-brands fa-whatsapp"></i>
            </div>
          </a>

          {/* MODAL DE CONFIRMAÇÃO */}
          <div className={`modal ${modalOpen ? 'active' : ''}`}>
            <div className="modal-overlay" onClick={() => setModalOpen(false)}></div>
            <div className="modal-content">
              <i className="fa-solid fa-circle-check" style={{ fontSize: '48px', color: 'var(--gold)', marginBottom: '15px' }}></i>
              <h3 style={{ color: 'var(--cream)', marginBottom: '10px' }}>Agendamento Confirmado!</h3>
              <p style={{ color: 'var(--text)', fontSize: '13px', lineHeight: '1.5' }}>
                Obrigado, <strong>{name}</strong>! Seu agendamento de <strong>{service}</strong> com <strong>{selectedBarber}</strong> foi realizado com sucesso para o dia <strong>{selectedDateStr}</strong> às <strong>{selectedTimeStr}</strong>.
              </p>
              <br />
              <button className="package-button" style={{ width: '100%' }} onClick={() => setModalOpen(false)}>Concluir</button>
            </div>
          </div>

          <footer className="footer">
            <div className="container">
              <p>&copy; 2026 Barbearia Elite. Todos os direitos reservados.</p>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<Barbearia />);
  </script>
</body>
</html>
